<svg xmlns="http://www.w3.org/2000/svg" width="300" height="220">
  <defs>
    <linearGradient id="lin">
      <stop offset="0" stop-color="#ff0000"/>
      <stop offset="0.5" stop-color="#ffff00"/>
      <stop offset="1" stop-color="#0000ff"/>
    </linearGradient>
    <linearGradient id="diag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.2" stop-color="#003"/>
      <stop offset="0.8" stop-color="#9cf"/>
    </linearGradient>
    <linearGradient id="user" gradientUnits="userSpaceOnUse" x1="20" y1="120" x2="60" y2="200" gradientTransform="rotate(10 40 160)">
      <stop offset="0" stop-color="#0a0"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <radialGradient id="rad">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#c06"/>
    </radialGradient>
    <radialGradient id="focal" cx="0.5" cy="0.5" r="0.5" fx="0.3" fy="0.35">
      <stop offset="0" stop-color="#ffd"/>
      <stop offset="0.6" stop-color="#f80"/>
      <stop offset="1" stop-color="#600"/>
    </radialGradient>
    <radialGradient id="ell" gradientUnits="userSpaceOnUse" cx="230" cy="170" r="30" gradientTransform="translate(230 170) scale(2 1) rotate(20) translate(-230 -170)">
      <stop offset="0" stop-color="#00f"/>
      <stop offset="1" stop-color="#0ff"/>
    </radialGradient>
    <linearGradient id="hard" x1="0" x2="1">
      <stop offset="0" stop-color="#f00"/>
      <stop offset="0.5" stop-color="#f00"/>
      <stop offset="0.5" stop-color="#00f"/>
      <stop offset="1" stop-color="#00f"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="130" height="40" fill="url(#lin)"/>
  <rect x="10" y="60" width="130" height="50" fill="url(#diag)"/>
  <rect x="10" y="120" width="60" height="90" fill="url(#user)"/>
  <circle cx="190" cy="50" r="40" fill="url(#rad)"/>
  <rect x="80" y="120" width="110" height="60" fill="url(#focal)"/>
  <rect x="190" y="130" width="100" height="80" fill="url(#ell)"/>
  <rect x="80" y="190" width="100" height="20" fill="url(#hard)"/>
  <path d="M240 10 h50 v90 h-50 Z M255 30 h20 v50 h-20 Z" fill="url(#lin)" fill-rule="evenodd" stroke="#000"/>
</svg>
